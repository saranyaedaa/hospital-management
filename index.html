<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - MediCare Admin</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables & Theme Setup */
        :root {
            --primary-navy: #0f172a;
            --primary-hover: #1e293b;
            --teal-accent: #0d9488;
            --teal-hover: #0f766e;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --danger-red: #ef4444;
            --purple-accent: #8b5cf6;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #334155;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --sidebar-width: 260px;
            --header-height: 70px;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-navy);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            transition: var(--transition);
            z-index: 100;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header .logo-icon {
            font-size: 24px;
            color: var(--teal-accent);
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 12px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-menu li {
            margin-bottom: 6px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 500;
            transition: var(--transition);
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: var(--primary-hover);
            color: #ffffff;
        }

        .sidebar-menu a.active {
            background-color: var(--teal-accent);
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: #64748b;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: var(--transition);
        }

        /* Top Navbar */
        .top-navbar {
            height: var(--header-height);
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            display: none;
        }

        #page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-navy);
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-box input {
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            font-size: 14px;
            width: 240px;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--teal-accent);
            width: 280px;
        }

        .notifications-icon {
            position: relative;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .badge-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            background-color: var(--danger-red);
            border-radius: 50%;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--teal-accent);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Content Views */
        .content-view {
            display: none;
            padding: 30px;
            flex: 1;
        }

        .content-view.active-view {
            display: block;
        }

        /* Statistics Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stats-grid.mb-4 {
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
        }

        .stat-icon.blue { background-color: #3b82f6; }
        .stat-icon.teal { background-color: var(--teal-accent); }
        .stat-icon.orange { background-color: var(--warning-orange); }
        .stat-icon.green { background-color: var(--success-green); }
        .stat-icon.purple { background-color: var(--purple-accent); }

        .stat-details h3 {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-details p {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-navy);
        }

        /* Dashboard Grids */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .dashboard-grid-secondary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Cards & Containers */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-navy);
        }

        .flex-header {
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Toolbar & Filters */
        .toolbar {
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .form-control {
            padding: 9px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
            color: var(--text-primary);
            background-color: #ffffff;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--teal-accent);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        /* Buttons */
        .btn {
            padding: 9px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        .btn-primary {
            background-color: var(--teal-accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--teal-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background-color: var(--bg-main);
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background-color: var(--danger-red);
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .data-table th, .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--primary-navy);
        }

        .data-table tbody tr {
            transition: var(--transition);
        }

        .data-table tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Status Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .badge.admitted, .badge.available, .badge.paid, .badge.completed, .badge.available-bed {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge.discharged, .badge.scheduled, .badge.pending {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .badge.outpatient, .badge.in-surgery {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge.cancelled, .badge.on-leave, .badge.occupied, .badge.maintenance {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .action-btn.edit {
            color: var(--teal-accent);
        }

        .action-btn.edit:hover {
            background-color: #f0fdfa;
        }

        .action-btn.delete {
            color: var(--danger-red);
        }

        .action-btn.delete:hover {
            background-color: #fef2f2;
        }

        /* Department Stats */
        .dept-stats-item {
            margin-bottom: 14px;
        }

        .dept-stats-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .dept-progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .dept-progress-fill {
            height: 100%;
            background-color: var(--teal-accent);
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 42px;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .empty-state.hidden {
            display: none;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            box-shadow: 0 2
